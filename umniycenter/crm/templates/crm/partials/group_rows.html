{% for group in groups %}
    <tr hx-get="{% url 'crm:group_drawer_edit' group.id %}" hx-target="#groupDrawerContent" hx-swap="outerHTML" hx-on::after-request="if (event.detail.xhr.status < 400) document.getElementById('groupDetailsDrawer').classList.add('is-open')">
        <td><div class="crm-table-name">{{ group.course.name }} · {{ group.number }}</div><span class="crm-table-meta">ID {{ group.id }}</span></td>
        <td><span class="crm-group-chip">{{ group.course.name }}</span></td>
        <td>{{ group.teacher|default:'-' }}</td>
        <td><strong>{{ group.students_count|default:0 }}</strong></td>
        <td>{% if group.is_active %}<span class="crm-status-badge crm-status-badge--active">Активная</span>{% else %}<span class="crm-status-badge crm-status-badge--archive">Архивная</span>{% endif %}</td>
        <td><button class="crm-table-action-btn" type="button" hx-get="{% url 'crm:group_drawer_edit' group.id %}" hx-target="#groupDrawerContent" hx-swap="outerHTML" hx-on::after-request="if (event.detail.xhr.status < 400) document.getElementById('groupDetailsDrawer').classList.add('is-open')" title="Открыть группу"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></td>
    </tr>
{% endfor %}
{% if has_more %}
    <tr class="crm-load-more-row"><td colspan="6"><button class="crm-load-more-btn" type="button" hx-get="{% url 'crm:groups_rows' %}?offset={{ next_offset }}" hx-target="closest tr" hx-swap="outerHTML" hx-include="#groupsSearch, .crm-toolbar__filters, #groupsStatusFilter">Загрузить еще</button></td></tr>
{% endif %}
