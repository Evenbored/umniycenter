{% for course in courses %}
    <tr hx-get="{% url 'crm:course_drawer_edit' course.id %}" hx-target="#courseDrawerContent" hx-swap="outerHTML" hx-on::after-request="if (event.detail.xhr.status < 400) document.getElementById('courseDetailsDrawer').classList.add('is-open')">
        <td><div class="crm-table-name">{{ course.name }}</div></td>
        <td><span class="crm-table-meta">ID {{ course.id }}</span></td>
        <td><button class="crm-table-action-btn" type="button" hx-get="{% url 'crm:course_drawer_edit' course.id %}" hx-target="#courseDrawerContent" hx-swap="outerHTML" hx-on::after-request="if (event.detail.xhr.status < 400) document.getElementById('courseDetailsDrawer').classList.add('is-open')" title="Открыть курс"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></td>
    </tr>
{% endfor %}
{% if has_more %}
    <tr class="crm-load-more-row"><td colspan="3"><button class="crm-load-more-btn" type="button" hx-get="{% url 'crm:courses_rows' %}?offset={{ next_offset }}" hx-target="closest tr" hx-swap="outerHTML" hx-include="#coursesSearch, .crm-toolbar__filters">Загрузить еще</button></td></tr>
{% endif %}
