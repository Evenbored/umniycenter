<div class="crm-modal" id="scheduleTemplateModal">
    <div class="crm-modal__overlay" onclick="closeScheduleTemplateModal()"></div>
    <div class="crm-modal__content crm-modal__content--lg">
        <div class="crm-modal__header"><h3>Добавить стандартное время</h3><button class="crm-modal__close" type="button" onclick="closeScheduleTemplateModal()">×</button></div>
        <div class="crm-modal__body">
            <form id="scheduleTemplateForm" hx-post="{% if selected_group %}{% url 'crm:group_template_save' selected_group.id %}{% endif %}" hx-target="#scheduleTemplateModal" hx-swap="outerHTML">
                {% csrf_token %}
                <div class="crm-form-field"><span>День недели *</span><select name="weekday" required><option value="0">Понедельник</option><option value="1">Вторник</option><option value="2">Среда</option><option value="3">Четверг</option><option value="4">Пятница</option><option value="5">Суббота</option><option value="6">Воскресенье</option></select></div>
                <div class="crm-form-field"><span>Время начала *</span><input name="start_time" type="time" required></div>
                <div class="crm-form-field"><span>Длительность *</span><select name="lessons_count" required><option value="1">1 занятие (45 минут)</option><option value="2" selected>2 занятия (90 минут)</option></select></div>
                <div class="crm-form-alert" {% if not form_error %}hidden{% endif %}>{{ form_error|default:'' }}</div>
            </form>
        </div>
        <div class="crm-modal__footer"><button class="crm-btn crm-btn--secondary" type="button" onclick="closeScheduleTemplateModal()">Отмена</button><button class="crm-btn crm-btn--primary" type="submit" form="scheduleTemplateForm">Добавить</button></div>
    </div>
</div>
