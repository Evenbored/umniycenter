<div class="crm-drawer__panel" id="tariffDrawerContent">
    <header class="crm-drawer__header">
        <div>
            <h3 id="tariffDrawerTitle">{{ drawer_title }}</h3>
            <p id="tariffDrawerSubtitle">{{ drawer_subtitle }}</p>
        </div>
        <button class="crm-btn-icon" type="button" onclick="closeTariffDrawer()" aria-label="Закрыть">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M18 6 6 18M6 6l12 12"/>
            </svg>
        </button>
    </header>

    <form
        class="crm-drawer__content crm-form"
        id="tariffForm"
        hx-post="{{ form_action }}"
        hx-target="#tariffDrawerContent"
        hx-swap="outerHTML"
    >
        {% csrf_token %}
        <div class="crm-form-alert" id="tariffFormAlert" {% if not form_error %}hidden{% endif %} hidden>{{ form_error|default:'' }}</div>
        <div class="crm-form-grid">
            <label class="crm-form-field">
                <span>Название *</span>
                <input id="tariffName" name="name" type="text" required value="{{ tariff_form.name }}">
            </label>
            <label class="crm-form-field">
                <span>Курс *</span>
                <select id="tariffCourse" name="course" required>
                    <option value="">Выберите курс</option>
                    {% for course in courses %}
                        <option value="{{ course.id }}" {% if tariff_form.course|add:'' == course.id|stringformat:'s' %}selected{% endif %}>{{ course.name }}</option>
                    {% endfor %}
                </select>
            </label>
            <label class="crm-form-field">
                <span>Тип абонемента *</span>
                <select id="tariffSubscriptionType" name="subscription_type" required>
                    {% for value, label in subscription_type_choices %}
                        <option value="{{ value }}" {% if tariff_form.subscription_type == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </label>
            <label class="crm-form-field">
                <span>Количество занятий *</span>
                <input id="tariffLessonsCount" name="lessons_count" type="number" min="1" required value="{{ tariff_form.lessons_count }}">
            </label>
            <label class="crm-form-field">
                <span>Срок действия, дней *</span>
                <input id="tariffValidityDays" name="validity_days" type="number" min="1" required value="{{ tariff_form.validity_days }}">
            </label>
            <label class="crm-form-field">
                <span>Цена, руб. *</span>
                <input id="tariffPrice" name="price" type="number" min="0" step="0.01" required value="{{ tariff_form.price }}">
            </label>
            <label class="crm-checkbox-line">
                <input id="tariffIsTrial" name="is_trial" type="checkbox" {% if tariff_form.is_trial %}checked{% endif %}>
                <span>Пробный тариф</span>
            </label>
            <label class="crm-checkbox-line">
                <input id="tariffIsActive" name="is_active" type="checkbox" {% if tariff_form.is_active %}checked{% endif %}>
                <span>Доступен для покупки</span>
            </label>
        </div>
        <label class="crm-form-field crm-form-field--full">
            <span>Описание</span>
            <textarea id="tariffDescription" name="description" rows="4">{{ tariff_form.description }}</textarea>
        </label>
    </form>

    <footer class="crm-drawer__footer">
        <button class="crm-btn crm-btn--secondary" type="button" onclick="closeTariffDrawer()">Отмена</button>
        <button class="crm-btn crm-btn--primary" type="submit" form="tariffForm" id="tariffSubmitBtn">{{ submit_label }}</button>
    </footer>
</div>
